name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore MagicMouseForWindows.sln
      - name: Test core
        run: dotnet test tests/MagicMouse.Core.Tests/MagicMouse.Core.Tests.csproj --no-restore
      - name: Package Windows x64
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MagicMouse-Windows-x64-preview
          path: artifacts/*.zip
